# Render blueprint: API (with the job worker and the upload disk) + one scheduler.
# Set the `sync: false` values in the Render dashboard; never commit secrets.
services:
  - type: web
    name: ledgerloop-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "./packages/*" build && pnpm --filter @ledgerloop/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER
        value: 'true'
      - key: RUN_SCHEDULER
        value: 'false'
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ledgerloop
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_SECURE
        value: 'true'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: LOG_LEVEL
        value: info

  - type: worker
    name: ledgerloop-scheduler
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "./packages/*" build && pnpm --filter @ledgerloop/api build
    startCommand: node apps/api/dist/scheduler.js
    envVars:
      - fromGroup: ledgerloop-shared

envVarGroups:
  - name: ledgerloop-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ledgerloop
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
