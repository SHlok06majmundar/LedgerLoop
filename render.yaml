# Render blueprint (free plan): the API runs the job worker and the scheduler
# in-process, and the web app is a second web service.
# Free services sleep after 15 idle minutes and have no persistent disk, so
# uploaded files are lost on restart (all data lives in MongoDB Atlas).
# For production, switch to `plan: starter`, add a disk at /var/data with
# UPLOAD_DIR=/var/data/uploads, and move the scheduler to its own worker.
# Set the `sync: false` values in the Render dashboard; never commit secrets.
services:
  - type: web
    name: ledgerloop-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter "@ledgerloop/api..." && pnpm --filter "@ledgerloop/api^..." build && pnpm --filter @ledgerloop/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER
        value: 'true'
      - key: RUN_SCHEDULER
        value: 'true'
      # Client, Cloudflare, then Render's internal proxy in X-Forwarded-For.
      - key: TRUST_PROXY_HOPS
        value: '3'
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ledgerloop
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_SECURE
        value: 'true'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: LOG_LEVEL
        value: info

  - type: web
    name: ledgerloop-web
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter "@ledgerloop/web..." && pnpm --filter "@ledgerloop/web^..." build && pnpm --filter @ledgerloop/web build
    startCommand: pnpm --filter @ledgerloop/web exec next start --port $PORT
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_PUBLIC_API_URL
        sync: false
